name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: cargo fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # The server embeds web/dist, so its build needs the SPA built.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace --no-tests=pass

  web:
    name: npm test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web test
      - run: npm --prefix web run build

  shell:
    name: tauri shell builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          # The shell crate is its own workspace root; its target dir sits
          # under web/src-tauri.
          workspaces: web/src-tauri
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Tauri on linux compiles against the webkit2gtk stack.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm --prefix web ci
      - run: npm --prefix web run tauri -- build --no-bundle --ci -- --locked
      # The release scripts only otherwise run at tag time; their own test
      # runs here, where a change meets it first.
      - run: python3 scripts/test_update_manifest.py

  image:
    name: docker build
    runs-on: ubuntu-latest
    needs: [rust, web]
    steps:
      - uses: actions/checkout@v7
      # The image test builds the image and exercises it end to end.
      - run: ./tests/image_test.sh

  publish:
    name: publish on tag
    # A release tag is what names the image the hub pulls. A -test tag is a
    # dry run for the shell releases and must neither mint an image tag nor
    # move :latest.
    if: startsWith(github.ref, 'refs/tags/v') && !endsWith(github.ref_name, '-test')
    needs: [rust, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - run: ./tests/image_test.sh
      - name: publish to ghcr
        run: |
          image="ghcr.io/vedhavyas/nazar"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag nazar:test "$image:$GITHUB_REF_NAME"
          docker tag nazar:test "$image:latest"
          docker push "$image:$GITHUB_REF_NAME"
          docker push "$image:latest"
          echo "[OK] published $image:$GITHUB_REF_NAME and $image:latest"
