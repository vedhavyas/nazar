[package]
name = "server"
version.workspace = true
edition.workspace = true
authors.workspace = true

[[bin]]
name = "nazar-server"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
futures-util = { workspace = true }
qubo = { workspace = true }
reqwest = { workspace = true }
rumqttc = { workspace = true }
rust-embed = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Every feature this crate's code names, including the ones its tests use
# directly (io-util for the fake broker's sockets), rather than whatever a
# sibling feature happens to pull in.
tokio = { workspace = true, features = ["io-util", "net", "process", "sync", "time"] }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }

[lints]
workspace = true
