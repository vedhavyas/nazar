[workspace]
resolver = "3"
members = ["crates/qubo", "crates/server"]

[workspace.package]
version = "0.5.8"
edition = "2024"
authors = ["Vedhavyas Singareddi <7549475+vedhavyas@users.noreply.github.com>"]

[workspace.dependencies]
aes = "0.8"
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
base64 = "0.22"
ctr = "0.9"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
qubo = { path = "crates/qubo" }
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
# native-tls, not rustls: rumqttc 0.25 pins rustls-webpki 0.102, which
# carries four live RUSTSEC advisories with no patched 0.102 release.
rumqttc = { version = "0.25", default-features = false, features = ["use-native-tls"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.42", features = ["macros", "rt-multi-thread"] }
tokio-tungstenite = "0.30"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"
dead_code = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_must_use = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
# Nothing here is published, so there is no docs.rs target and no public
# API contract to document against.
missing_docs = "allow"
# `unused_crate_dependencies` is deliberately absent: it false-positives
# on integration-test targets, where each test binary imports a subset of
# the lib's dependencies. Opt in per src/lib.rs instead.

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
# Pedantic exemptions, each with its reason inline.
module_name_repetitions = "allow"   # Rust-idiomatic; not actually repetition.
must_use_candidate = "allow"        # Most fns don't need the marker.
missing_errors_doc = "allow"        # thiserror covers public-error docs.
missing_panics_doc = "allow"        # `panic` is denied above; noise is minimal.
doc_markdown = "allow"              # Bare crate paths in prose are fine.
